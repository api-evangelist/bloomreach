name: Bloomreach
description: Digital commerce experience platform with REST APIs for search, merchandising, recommendations, CDP, and email/SMS marketing automation.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
url: https://raw.githubusercontent.com/api-evangelist/bloomreach/refs/heads/main/apis.yml
created: "2026-06-13"
modified: "2026-06-13"
specificationVersion: "0.19"
type: Index
tags:
  - Digital Commerce
  - Search
  - Merchandising
  - Recommendations
  - Customer Data Platform
  - CDP
  - Email Marketing
  - SMS Marketing
  - Marketing Automation
  - Headless CMS
  - Personalization
  - E-commerce

apis:

  - name: Bloomreach Discovery API
    description: REST APIs for site search, category browsing, autosuggest, recommendations, bestseller listings, and content search powered by Bloomreach's autonomous search engine.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://documentation.bloomreach.com/discovery/reference/welcome
    baseURL: https://core.dxpapi.com/api/v1
    tags:
      - Search
      - Category Search
      - Autosuggest
      - Recommendations
      - Bestseller
      - Content Search
    properties:
      - type: Documentation
        url: https://documentation.bloomreach.com/discovery/reference/welcome
      - type: OpenAPI
        url: https://github.com/bloomreach/api-specs/blob/main/discovery/search-category.yaml
      - type: OpenAPI
        url: openapi/bloomreach-discovery-search-category-openapi.yml
      - type: OpenAPI
        url: openapi/bloomreach-discovery-autosuggest-openapi.yml
      - type: OpenAPI
        url: openapi/bloomreach-discovery-bestseller-openapi.yml
      - type: OpenAPI
        url: openapi/bloomreach-discovery-content-search-openapi.yml
      - type: OpenAPI
        url: openapi/bloomreach-discovery-recommendations-pathways-openapi.yml
      - type: OpenAPI
        url: openapi/bloomreach-discovery-email-widget-openapi.yml
      - type: JSONSchema
        url: json-schema/bloomreach-product-schema.json
      - type: JSONSchema
        url: json-schema/bloomreach-search-response-schema.json
      - type: JSONSchema
        url: json-schema/bloomreach-suggest-response-schema.json
      - type: Examples
        url: examples/bloomreach-product-search-request-example.json
      - type: Examples
        url: examples/bloomreach-product-search-response-example.json
      - type: Examples
        url: examples/bloomreach-autosuggest-response-example.json
      - type: RateLimits
        url: https://documentation.bloomreach.com/discovery/reference/api-rate-limits

  - name: Bloomreach Discovery Catalog Management API
    description: REST API for sending and managing product catalog data to Bloomreach, supporting full feed uploads, incremental patch updates, and indexing job triggers for search and merchandising.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://documentation.bloomreach.com/discovery/reference/catalog-management-api-v3
    baseURL: https://api.bloomreach.com
    tags:
      - Catalog
      - Product Data
      - Feed Management
      - Indexing
    properties:
      - type: Documentation
        url: https://documentation.bloomreach.com/discovery/reference/catalog-management-api-v3
      - type: OpenAPI
        url: https://github.com/bloomreach/api-specs/blob/main/discovery/catalog-management.yaml
      - type: OpenAPI
        url: openapi/bloomreach-discovery-catalog-management-openapi.yml
      - type: JSONSchema
        url: json-schema/bloomreach-product-schema.json
      - type: Examples
        url: examples/bloomreach-catalog-product-put-example.json
      - type: RateLimits
        url: https://documentation.bloomreach.com/discovery/reference/catalog-data-management-api-rate-limits

  - name: Bloomreach Engagement API
    description: REST API for the Bloomreach Engagement marketing automation and CDP platform, enabling customer tracking, segmentation, campaign management, email/SMS sends, recommendations, and analytics.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://documentation.bloomreach.com/engagement/reference/about
    baseURL: https://api.exponea.com
    tags:
      - Marketing Automation
      - CDP
      - Customer Data Platform
      - Email
      - SMS
      - Tracking
      - Segmentation
      - Campaigns
    properties:
      - type: Documentation
        url: https://documentation.bloomreach.com/engagement/reference/about
      - type: Authentication
        url: https://documentation.bloomreach.com/engagement/reference/authentication

  - name: Bloomreach Content Management API
    description: REST APIs for managing headless CMS content, including site channels, content types, documents, folders, batch import/export, projects, integrations, webhooks, and delivery API settings.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://documentation.bloomreach.com/content/reference/management-apis
    baseURL: https://api.bloomreach.com
    tags:
      - Headless CMS
      - Content Management
      - Channels
      - Webhooks
      - Projects
    properties:
      - type: Documentation
        url: https://documentation.bloomreach.com/content/reference/management-apis
      - type: Authentication
        url: https://documentation.bloomreach.com/content/reference/api-authorization

  - name: Bloomreach Content Delivery API
    description: REST endpoints for SPAs and front-end applications to retrieve JSON representations of available channels, pages, and documents from the Bloomreach headless CMS.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://documentation.bloomreach.com/content/reference/delivery-api
    baseURL: https://api.bloomreach.com
    tags:
      - Headless CMS
      - Content Delivery
      - SPA
      - Channels
      - Pages
    properties:
      - type: Documentation
        url: https://documentation.bloomreach.com/content/reference/delivery-api

  - name: Bloomreach Data Hub Workspace Import API
    description: REST API for importing workspace data into Bloomreach Data Hub, enabling unified data platform operations across customer and product data.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://documentation.bloomreach.com/
    baseURL: https://api.bloomreach.com
    tags:
      - Data Hub
      - Data Import
      - Workspace
      - Unified Data
    properties:
      - type: Documentation
        url: https://documentation.bloomreach.com/
      - type: OpenAPI
        url: https://github.com/bloomreach/api-specs/blob/main/data-hub/workspace-import-api.yaml
      - type: OpenAPI
        url: openapi/bloomreach-data-hub-workspace-import-openapi.yml

