name: Bloomreach
description: >-
  Bloomreach is a commerce experience cloud combining an e-commerce search and merchandising engine
  (Discovery), a marketing automation platform and customer data platform (Engagement, formerly
  Exponea), and a headless content management system (Content, formerly Hippo/brXM). It publishes
  REST APIs for product and category search, autosuggest, recommendation widgets, catalog
  management and indexing, customer tracking and segmentation, email and SMS campaigns, and
  headless content delivery and management. Its Loomi AI layer adds agentic capabilities, and
  Loomi Connect exposes the estate to AI agents as an OAuth-protected remote MCP server carrying
  more than 160 tools across marketing, analytics, search and data hub.
