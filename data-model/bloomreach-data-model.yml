generated: '2026-08-13'
method: derived
source: openapi/*.yml components.schemas $ref graph
description: 'Entity graph derived from every components.schemas block in the harvested Bloomreach OpenAPIs.
  The graph is Discovery-shaped because that is where Bloomreach publishes machine-readable contracts:
  catalogs contain records, records fan out into variants and views, and search/widget responses wrap
  product documents. The Engagement domain — customers, events, scenarios, campaigns, segments, initiatives,
  vouchers — is entirely absent from the specs and is only visible through the Loomi Connect MCP tool
  catalogue.'
domains:
- domain: Discovery catalog
  root: Catalog
  chain: Account > Catalog > Environment > Record > (Variant | View > Variant)
  identifiers:
    account_name: path
    catalog_name: path
    environment_name: path
    record_id: path
    variant_id: path
    view_id: path
  concurrency: Records carry an ETag; conditional PATCH uses if_match_etag
- domain: Discovery search
  root: SearchResponse
  note: Search, autosuggest, bestseller and content-search all return a response envelope wrapping product
    documents plus facets.
- domain: Discovery widgets
  root: Widget
  note: Widgets are addressed by widget_id and typed by strategy — category, keyword, item, global, personalized,
    recently-viewed, visual.
- domain: Data Hub imports
  root: Import
  chain: Workspace > Import > Job
  note: startWorkspaceImport is the single published write operation.
- domain: Engagement / Marketing
  root: null
  note: 'No OpenAPI is harvested for this domain. Its entity vocabulary is recoverable from the Loomi
    Connect tool names: Organization > Workspace > Project > (Customer, Event, Scenario, EmailCampaign,
    SmsCampaign, Segment, CustomerFilter, Initiative, VoucherPool, VoucherCode, Catalog, Recommendation,
    Report, Dashboard, Prediction, Experiment). See mcp/bloomreach-tool-crosswalk.yml.'
- domain: Content
  root: Channel
  note: No OpenAPI is harvested for this domain either. The Content reference names Channel, Page, Component,
    Route, Menu, Layout, Document, Folder, ResourceBundle, ContentType, Project and Webhook as the managed
    resources, each with its own management API.
