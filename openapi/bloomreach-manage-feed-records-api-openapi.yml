openapi: 3.2.0
info:
  title: Catalog management Manage feed records API
  version: 3.0.0
servers:
- url: https://discovery.bloomreach.com/dataconnect/api/v3
security:
- bearerAuth: []
tags:
- name: Manage feed records
paths:
  /accounts/{account_name}/catalogs/{catalog_name}/environments/{environment_name}/records:
    parameters:
    - $ref: '#/components/parameters/AccountName'
    - $ref: '#/components/parameters/CatalogName'
    - $ref: '#/components/parameters/EnvironmentName'
    - $ref: '#/components/parameters/PageNumber'
    - $ref: '#/components/parameters/PageLimit'
    get:
      tags:
      - Manage feed records
      summary: Get current records
      description: View the current state of product and item feed records in a catalog.
      responses:
        200:
          description: OK. Click to see the response structure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      records:
                        type: array
                        items:
                          oneOf:
                          - $ref: '#/components/schemas/Product'
                          - $ref: '#/components/schemas/ProductSummary'
                          - $ref: '#/components/schemas/Item'
                          - $ref: '#/components/schemas/ItemSummary'
        400:
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  details:
                    type: array
                    items:
                      $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Unauthorized
        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404Response'
        429:
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/429Response'
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500Response'
      operationId: getAccountsByAccountNameCatalogsByCatalogNameEnvironmentsByEnvironmentNameRecords
      x-operation-id-source: derived
    put:
      tags:
      - Manage feed records
      summary: Upload full feed
      description: Upload the entire feed data at once.
      requestBody:
        content:
          application/json:
            schema:
              description: List of file names to be processed
              type: array
              items:
                type: string
          application/json-patch+json:
            schema:
              description: List of JSON Lines patch operations
              type: array
              items:
                type: object
          application/json-patch+jsonlines:
            schema:
              description: JSON Lines patch operations
              type: object
      responses:
        200:
          description: OK. Click to see the response structure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      job_id:
                        type: string
        400:
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  details:
                    type: array
                    items:
                      $ref: '#/components/schemas/ErrorResponse'
        406:
          description: Invalid Content-Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/406Response'
        413:
          description: Content Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/413Response'
        429:
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/429Response'
      operationId: putAccountsByAccountNameCatalogsByCatalogNameEnvironmentsByEnvironmentNameRecords
      x-operation-id-source: derived
    patch:
      tags:
      - Manage feed records
      summary: Modify feed records
      description: Edit/change or add particular product or item records in the feed.
      requestBody:
        content:
          application/json:
            schema:
              description: List of file names to be processed
              type: array
              items:
                type: string
          application/json-patch+json:
            schema:
              description: List of JSON Lines patch operations
              type: array
              items:
                type: object
          application/json-patch+jsonlines:
            schema:
              description: JSON Lines patch operations
              type: object
      responses:
        200:
          description: OK. Click to see the response structure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      job_id:
                        type: string
        400:
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  details:
                    type: array
                    items:
                      $ref: '#/components/schemas/ErrorResponse'
        406:
          description: Invalid Content-Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/406Response'
        413:
          description: Content Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/413Response'
        429:
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/429Response'
      operationId: patchAccountsByAccountNameCatalogsByCatalogNameEnvironmentsByEnvironmentNameRecords
      x-operation-id-source: derived
  /accounts/{account_name}/catalogs/{catalog_name}/environments/{environment_name}/records/{record_id}:
