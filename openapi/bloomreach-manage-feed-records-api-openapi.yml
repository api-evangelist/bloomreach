    get:
      tags:
      - Manage feed records
      summary: Get views
      description: Get all the views associated with a product or item feed record.
      responses:
        200:
          description: OK. Click to see the response structure.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    meta:
                      type: object
                      properties:
                        count:
                          type: integer
                    data:
                      type: object
                      properties:
                        views:
                          type: object
                          additionalProperties:
                            oneOf:
                            - $ref: '#/components/schemas/ProductView'
                            - $ref: '#/components/schemas/ItemView'
                - type: object
                  properties:
                    meta:
                      type: object
                      properties:
                        count:
                          type: integer
                    data:
                      type: object
                      properties:
                        views:
                          type: array
                          items:
                            oneOf:
                            - $ref: '#/components/schemas/ProductViewsetPreview'
                            - $ref: '#/components/schemas/ItemViewsetPreview'
                - type: object
                  properties:
                    meta:
                      type: object
                      properties:
                        count:
                          type: integer
                        previous_page:
                          type: string
                        next_page:
                          type: string
                      required:
                      - count
                    data:
                      type: object
                      properties:
                        views:
                          type: array
                          items:
                            oneOf:
                            - $ref: '#/components/schemas/ProductViewSummary'
                            - $ref: '#/components/schemas/ItemViewSummary'
        401:
          description: Unauthorized
        404:
          description: Not found
          content:
            application/json:
              schema:
