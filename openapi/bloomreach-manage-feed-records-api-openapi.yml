components:
  schemas:
    ProductVariantViewSummary:
      description: ''
      type: object
      properties:
        id:
          type: string
        attributes:
          type: object
        exclude_from_view:
          type: boolean
      required:
      - id
      - attributes
      - exclude_from_view
    ProductSummary:
      description: ''
      type: object
      properties:
        id:
          type: string
        attributes:
          type: object
        variant_record_count:
          type: integer
        view_count:
          type: integer
        product_view_override_record_count:
          type: integer
        variant_view_override_record_count:
          type: integer
      required:
      - id
      - attributes
    406Response:
      description: Not Acceptable
      type: object
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponse'
    Product:
      description: ''
      type: object
      properties:
        attributes:
          type: object
        variants:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ProductVariant'
        views:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ProductView'
      required:
      - attributes
    Item:
      description: ''
      type: object
      properties:
        attributes:
          type: object
        views:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ItemView'
      required:
      - attributes
    429Response:
      description: Too Many Requests
      type: object
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponse'
    ProductVariantSummary:
      type: object
      properties:
        id:
          type: string
        attributes:
          type: object
      required:
      - id
      - attributes
    ProductVariant:
      type: object
      properties:
        attributes:
          type: object
      required:
      - attributes
    ProductViewPreview:
      description: ''
      type: object
      properties:
        variants:
          type: object
        attributes:
          type: object
      required:
      - variants
      - attributes
    ItemViewSummary:
      description: ''
      type: object
      properties:
        id:
          type: string
        attributes:
          type: object
      required:
      - id
      - attributes
    ItemViewsetPreview:
      description: ''
      type: object
      properties:
        view_ids:
          type: array
          items:
            type: string
        attributes:
          type: object
      required:
      - view_ids
      - attributes
    ItemView:
      description: ''
      type: object
      properties:
        attributes:
          type: object
      required:
      - attributes
    ItemSummary:
      description: ''
      type: object
      properties:
        id:
          type: string
        attributes:
          type: object
        view_count:
          type: integer
      required:
      - id
      - attributes
    ItemViewPreview:
      description: ''
      type: object
      properties:
        attributes:
          type: object
      required:
      - attributes
    ErrorResponse:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        detail:
          type: string
        class:
          type: string
          enum:
          - error
          - warning
    ProductViewSummary:
      description: ''
      type: object
      properties:
        id:
          type: string
        attributes:
          type: object
        variant_override_record_count:
          type: integer
      required:
      - id
      - attributes
      - variant_override_record_count
    413Response:
      description: Content Too Large
      type: object
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponse'
    ProductViewsetPreview:
      description: ''
      type: object
      properties:
        view_ids:
          type: array
          items:
            type: string
        variants:
          type: object
        attributes:
          type: object
      required:
      - view_ids
      - variants
      - attributes
    ProductView:
      description: ''
      type: object
      properties:
        attributes:
          type: object
        variants:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ProductVariantView'
      required:
      - attributes
      - variants
    ProductVariantView:
      description: ''
      type: object
      properties:
        id:
          type: string
        attributes:
          type: object
        exclude_from_view:
          type: boolean
      required:
      - id
      - attributes
      - exclude_from_view
    404Response:
      description: Not Found
      type: object
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponse'
    500Response:
      description: Internal Server Error
      type: object
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    CatalogName:
      description: '"Catalog name" is also called domain key. Use the same value as your domain key in your search API requests.'
      name: catalog_name
      in: path
      schema:
        type: string
        minLength: 1
        maxLength: 64
      required: true
      example: homeoasis_fr
    Mode:
      description: '* raw - returns only the raw view/variant data of a feed record

        * preview - returns a preview of the complete feed record containing all attributes, views, and variants

        '
      name: mode
      in: query
      schema:
        type: string
        enum:
        - raw
        - preview
      required: false
    ViewId:
      description: "A unique identifier for a specific view of your product catalog.\nIf you have multiple versions of your site, each with its product catalog characteristics like product titles and prices, then add view_id to your call.\n\nBloomreach uses your view_id parameter value to display the right product information for your customers based on their individual site views. \nYou can enter any string value to identify the specific site catalog view. This string must be consistent in your pixel, API, and product catalog.\n"
      name: view_id
      in: path
      schema:
        type: string
        minLength: 1
        maxLength: 64
      required: true
      example: 1324abc
    RecordId:
      description: The unique ID associated with a product or item feed record.
      name: record_id
      in: path
      schema:
        type: string
        minLength: 1
        maxLength: 64
      required: true
      example: 1111abcd
    VariantId:
      description: A unique identifier for a specific variant of a product or item feed record.
      name: variant_id
      in: path
