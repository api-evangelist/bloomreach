generated: '2026-08-13'
method: derived
source: mcp/bloomreach-mcp.yml + openapi/*.yml
description: 'Binds the Loomi Connect MCP tool catalog to the OpenAPI operations Bloomreach publishes.
  The divergence is the finding: Bloomreach exposes 163 product tools over MCP but publishes OpenAPI for
  only the Discovery/Data Hub slice, so the overwhelming majority of the agent surface has no machine-readable
  REST contract behind it. The Loomi docs say so directly — the tools "call the same APIs that power the
  Bloomreach UI, not dedicated backend endpoints".'
surfaces:
  openapi:
    files: 21
    operations: 42
    note: Discovery search/recommendation/catalog + one Data Hub workspace import operation. Refined from
      Bloomreach's published specs in openapi/_original/.
  openapi_visible_to_agents:
    count: 43
    via: https://documentation.bloomreach.com/mcp (list-specs)
    note: The docs MCP server enumerates 43 OpenAPI specs across data-hub, content, discovery and engagement
      — far more than the 8 originals harvested here. Those definitions are rendered in ReadMe but the
      /openapi/<id> download endpoints now 302 to /404, so they could not be saved verbatim.
  mcp:
    url: https://us.connect.loomi.ai/mcp
    gated: true
    note: tools/list returns HTTP 401 invalid_token; tools mapped from the provider-published docs catalog.
  mcp_public:
    url: https://uqa.api.exponea.dev/cocoaas/public/api/clarity-search/v1/mcp/019d4917-3c76-7479-9f00-06c620b231bb
    gated: false
    note: Conversations prototype server; tools/list probed anonymously, inputSchemas are real.
  graphql:
    present: false
    note: No GraphQL surface found on any Bloomreach host.
