generated: '2026-08-13'
method: searched
source: https://documentation.bloomreach.com/loomi-connect/docs/get-started-with-mcp
status: published
description: 'Bloomreach ships MCP as a first-class agent surface under the Loomi Connect brand. Three
  distinct remote MCP servers were found and probed: (1) the regional Loomi Connect production servers,
  OAuth-gated, exposing 159 documented tools across Marketing, Analytics, Search and Data Hub; (2) a public,
  unauthenticated Conversations prototype server whose tools/list was probed live and returned real inputSchemas;
  and (3) a ReadMe-provided documentation MCP server on the Bloomreach docs host that exposes 43 OpenAPI
  specs to agents. All three are remote HTTP endpoints an MCP client POSTs to — Bloomreach publishes no
  local stdio package.'
deployment:
  mode: remote
  endpoint: https://us.connect.loomi.ai/mcp
  auth: oauth
  verified: probed
  note: Region-specific endpoints; the docs instruct you to replace the default US URL with the one matching
    your project. POST to the endpoint without a token returns HTTP 401 with a WWW-Authenticate Bearer
    challenge and a resource_metadata pointer, confirming a live OAuth-protected remote server. No stdio/npx
    package is published.
servers:
- name: Loomi Connect MCP
  transport: http
  protocol: streamable-http
  status: beta (early access)
  url: https://us.connect.loomi.ai/mcp
  regional_endpoints:
  - https://us.connect.loomi.ai/mcp
  - https://eu.connect.loomi.ai/mcp
  - https://uk.connect.loomi.ai/mcp
  - https://ca.connect.loomi.ai/mcp
  - https://ap.connect.loomi.ai/mcp
  docs: https://documentation.bloomreach.com/loomi-connect/docs/get-started-with-mcp
  install: claude mcp add loomi-mcp --transport http https://us.connect.loomi.ai/mcp
  auth:
    type: oauth
    flow: authorization_code
    pkce: S256
    identity: Bloomreach single sign-on (OIDC)
    session_lifetime: up to 30 days
    authorization_server: https://us.connect.loomi.ai/
    metadata_file: well-known/bloomreach-loomi-oauth-authorization-server.json
    protected_resource_file: well-known/bloomreach-loomi-oauth-protected-resource.json
    scopes:
    - openid
    - profile
    - email
    authorization: Server enforces the caller's existing Bloomreach IAM permissions, including PII masking
      to ****** for callers lacking administration.pii.flag
    access: Contact loomi-connect@bloomreach.com to have the server enabled for your accounts or projects
  probe:
    url: https://us.connect.loomi.ai/mcp
    method: POST tools/list
    http_status: 401
    result: invalid_token — the live schema is auth-gated. The tool catalog below is the provider-published
      list from the docs (names + descriptions only); per-tool inputSchemas require authenticated introspection.
    fetched: '2026-08-13'
  rate_limits:
    global: 1 call/second and 60 calls/minute
    write_tools: 1 call/5 seconds and 10 calls/minute, on top of the global limit
    delete_tools: 1 call/10 seconds and 10 calls/minute
    error_message: 'Too many requests: rate limit reached for key ''<key>'' (<limit>). Retry after ~<N>
      second(s).'
    docs: https://documentation.bloomreach.com/loomi-connect/docs/mcp-performance-and-rate-limits
  resources: Serves built-in workflow guides as MCP resources that load automatically into the client
    context
  caching: Responses are cached; volatile resources for seconds, stable metadata for longer
  tool_count: 159
