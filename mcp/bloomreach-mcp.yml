- name: Loomi Connect Conversations server
  transport: http
  protocol: streamable-http
  status: prototype
  url: https://uqa.api.exponea.dev/cocoaas/public/api/clarity-search/v1/mcp/019d4917-3c76-7479-9f00-06c620b231bb
  docs: https://documentation.bloomreach.com/loomi-connect/docs/connect-the-conversations-server
  auth:
    type: none
    note: Shared public prototype endpoint — no API key and no per-customer setup
  probe:
    method: POST initialize + tools/list
    http_status: 200
    server_info:
      name: clarity-search
      version: 1.0.0
    protocol_version: '2025-06-18'
    result: Live tool list with full inputSchema returned anonymously
    fetched: '2026-08-13'
  dataset:
    catalog: Pacific Apparel
    skus: ~13,000
    brands: ~370
    note: Fixed sample catalog — products, prices and attributes cannot be modified
  tool_count: 4
  tools:
  - name: search_products
    title: Product Search
    description: Search products in the First catalog using natural language queries with optional structured
      filters.
  - name: get_product
    title: Get Product
    description: Look up a specific product by its identifier.
  - name: search_productCollections
    title: Product Search Collection (Composed Intent)
    description: Execute multiple INDEPENDENT product searches in the First catalog for ORTHOGONAL user
      intents.
  - name: seeker_products
    title: Product Seeker - Discovery Assistant
    description: Use this tool when the visitor has a VAGUE or EXPLORATORY query without specific product
      attributes.
- name: Bloomreach Documentation MCP
  transport: http
  protocol: streamable-http
  status: published
  url: https://documentation.bloomreach.com/mcp
  discovery:
  - well-known/bloomreach-mcp-server-card.json
  - well-known/bloomreach-content-mcp-server-card.json
  - well-known/bloomreach-discovery-mcp-server-card.json
  - well-known/bloomreach-engagement-mcp-server-card.json
  auth:
    type: none
  provider_note: Provided by the ReadMe documentation platform and served from Bloomreach's own documentation
    host. It is a documentation/API-reference explorer, not a product API server, and its server-card
    name is com.readme/bloomreach* rather than a Bloomreach namespace.
  probe:
    method: POST initialize + tools/list
    http_status: 200
    server_info:
      name: Bloomreach Documentation
      version: 1.0.0
    protocol_version: '2025-06-18'
    fetched: '2026-08-13'
  tool_count: 5
  tools:
  - name: list-endpoints
    title: List API Endpoints
    description: Lists all API paths and their HTTP methods with summaries, organized by path.
  - name: get-endpoint
    title: Get Endpoint Details
    description: Gets detailed information about a specific API endpoint, including security schemes and
      servers.
  - name: search-endpoints
    title: Search API Endpoints
    description: Deep search through paths, operations and parameters to discover relevant API endpoints.
