description: >-
  Bloomreach ships first-party client libraries across three product lines that were built by
  three different engineering histories: the Content/brXM SPA SDKs (@bloomreach/* on npm, still
  released weekly), the Engagement/Exponea mobile + React Native SDKs (published under the legacy
  exponea namespace on CocoaPods, Maven Central and npm, still current), and the Discovery front-end
  SDKs (npm + GitHub, some going stale). There is no first-party Python, Go, Ruby, PHP or .NET
  client for any Bloomreach API.

